title: Cedric Bendavid
email: satiatemyhunger@gmail.com
description: >-
  Private chef and catering services — bespoke dinners, cooking lessons, and event menus.

# Custom domain setup
url: "https://chefced.ca"
baseurl: ""   # leave empty for root domain

# Build settings
theme: minima
plugins:
  - jekyll-feed

# Navigation (Minima v2)
header_pages:
  - Recipes.markdown
  - about.markdown
  - consultation.markdown

# Defaults for posts
defaults:
  - scope:
      path: "_posts"
      type: "posts"
    values:
      layout: "post"

# Social links (footer icons)
github_username: cedricstor
instagram_username: chef_ced44
linkedin_username: cedric-bendavid-36440924a

# Calendar button (used by footer and includes)
calendar:
  button:
    url: "https://calendar.google.com/calendar/appointments/schedules/AcZssZ0pdIruamkyAJ8x7IN_EWPi4cueunjr73Ngvj63droip65SIKSyX3RZvKSnx63dwSV4XoajJ8Kt?gv=true"
    color: "#039BE5"
    label: "Book an appointment"

# Sass/SCSS compile options
sass:
  sass_dir: _sass
  style: compressed

# Newsletter signup (Buttondown example)
newsletter:
  form_action: "https://buttondown.email/api/emails/embed-subscribe/your-list-id"
  heading: "Subscribe for updates"
  text: "Get new recipes and announcements by email."
  button_label: "Subscribe"

# RSS feed label
rss: "RSS"