# Site settings
# These are used to personalize your new site. If you look in the HTML files,
# you will see them accessed via {{ site.title }}, {{ site.email }}, and so on.
# You can create any custom variable you would like, and they will be accessible
# in the templates via {{ site.myvariable }}.

title: Cedric Bendavid
email: satiatemyhunger@gmail.com
description: >-
  Private chef and catering services — bespoke dinners, cooking lessons, and event menus.
baseurl: "https://chefced.ca"
url: ""

# Build settings
theme: minima
plugins:
  - jekyll-feed

defaults:
  -
    scope:
      path: ""
      type: "posts"
    values:
      layout: "post"

# Minima v2 style social links
github_username: cedricstor
instagram_username: chef_ced44
linkedin_username: cedric-bendavid-36440924a

